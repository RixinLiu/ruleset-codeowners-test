name: make a PR as github-actions
on:
  workflow_dispatch:
    inputs:
      file:
        default: owned/a.txt
      branch:
        default: bot-change
permissions:
  contents: write
  pull-requests: write
jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b ${{ inputs.branch }}
          echo v3 > ${{ inputs.file }}
          git commit -am "bot changes the owned file"
          git push origin ${{ inputs.branch }}
          gh pr create --base main --head ${{ inputs.branch }} --title "bot changes ${{ inputs.file }}" --body test
